<!DOCTYPE html>
<html>
<head>
    <title>Elementary Bible</title>
    <link rel="icon" type="image/png" sizes="16x16" href="./Assets/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./Assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./Assets/favicon-48.png" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <script type="text/javascript" src="./require.js"></script>
    <script type="module" src="./uno-bootstrap.js"></script>
    $(ADDITIONAL_CSS)
    $(ADDITIONAL_HEAD)
</head>
<body>
    <div id="elementary-system-gesture-area" aria-hidden="true"></div>
    <script>
        // This temporary shim is only for iOS/iPadOS Home Screen apps.
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
            || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        const standaloneMode = window.matchMedia("(display-mode: standalone)");
        const updateGestureShim = () => document.documentElement.classList.toggle(
            "elementary-ios-standalone", isIOS && (navigator.standalone === true || standaloneMode.matches));
        updateGestureShim();
        standaloneMode.addEventListener("change", updateGestureShim);
        // Uno listens on BODY in capture phase, so target/bubble handlers on the
        // overlay run too late. Intercept at WINDOW before Uno sees pointerdown,
        // then suppress that pointer's whole sequence even after it leaves the strip.
        // Do not preventDefault: the system still owns the home/app-switch gesture.
        const gestureArea = document.getElementById("elementary-system-gesture-area");
        const systemGesturePointers = new Set();
        for (const eventName of ["pointerover", "pointerout", "pointerdown", "pointermove", "pointerup", "pointercancel"]) {
            window.addEventListener(eventName, event => {
                if (!document.documentElement.classList.contains("elementary-ios-standalone")) return;
                const inStrip = event.target === gestureArea;
                if (event.type === "pointerdown") {
                    systemGesturePointers.delete(event.pointerId);
                    if (inStrip && event.pointerType === "touch") systemGesturePointers.add(event.pointerId);
                }
                if (systemGesturePointers.has(event.pointerId)
                    || (inStrip && (event.type === "pointerover" || event.type === "pointerout"))) {
                    event.stopImmediatePropagation();
                }
                if (event.type === "pointerup" || event.type === "pointercancel") systemGesturePointers.delete(event.pointerId);
            }, { capture: true, passive: true });
        }
        window.addEventListener("pagehide", () => systemGesturePointers.clear());
        for (const eventName of ["touchstart", "touchmove", "touchend", "touchcancel"]) {
            gestureArea.addEventListener(eventName, event => event.stopPropagation(), { passive: true });
        }
    </script>
    <div id="uno-body" class="container-fluid uno-body">
        <div class="uno-loader"
             loading-position="bottom"
             loading-alert="none">

            <!-- Logo: change src to customize the logo -->
            <img class="logo"
                 src=""
                 alt="Elementary" title="Loading Elementary" />

            <progress></progress>
            <span class="alert"></span>
        </div>
    </div>
    <noscript>
        <p>This application requires Javascript and WebAssembly to be enabled.</p>
    </noscript>
</body>
</html>
