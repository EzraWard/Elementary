<!DOCTYPE html>
<html>
<head>
    <title>__ELEMENTARY_WEB_NAME__</title>
    <link rel="apple-touch-icon" sizes="256x256" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./Assets/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./Assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./Assets/favicon-48.png" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-title" content="__ELEMENTARY_WEB_NAME__" />

    <script type="text/javascript" src="./require.js"></script>
    <script type="module" src="./uno-bootstrap.js"></script>
    $(ADDITIONAL_CSS)
    $(ADDITIONAL_HEAD)
</head>
<body>
    <div id="elementary-system-gesture-area" aria-hidden="true"></div>
    <script>
        // The navigation layout is shared by iOS browsers and Home Screen apps.
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
            || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        globalThis.elementaryPrefersReducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
        globalThis.elementaryIsIos = () => isIOS;

        // The gesture shim is only for iOS/iPadOS Home Screen apps.
        const standaloneMode = window.matchMedia("(display-mode: standalone)");
        const updateGestureShim = () => document.documentElement.classList.toggle(
            "elementary-ios-standalone", isIOS && (navigator.standalone === true || standaloneMode.matches));
        updateGestureShim();
        standaloneMode.addEventListener("change", updateGestureShim);
        // Uno listens on BODY in capture phase, so target/bubble handlers on the
        // overlay run too late. Intercept at WINDOW before Uno sees pointerdown,
        // then suppress that pointer's whole sequence even after it leaves the strip.
        // Do not preventDefault: the system still owns the home/app-switch gesture.
        const gestureArea = document.getElementById("elementary-system-gesture-area");
        const systemGesturePointers = new Set();
        for (const eventName of ["pointerover", "pointerout", "pointerdown", "pointermove", "pointerup", "pointercancel"]) {
            window.addEventListener(eventName, event => {
                if (!document.documentElement.classList.contains("elementary-ios-standalone")) return;
                const inStrip = event.target === gestureArea;
                if (event.type === "pointerdown") {
                    systemGesturePointers.delete(event.pointerId);
                    if (inStrip && event.pointerType === "touch") systemGesturePointers.add(event.pointerId);
                }
                if (systemGesturePointers.has(event.pointerId)
                    || (inStrip && (event.type === "pointerover" || event.type === "pointerout"))) {
                    event.stopImmediatePropagation();
                }
                if (event.type === "pointerup" || event.type === "pointercancel") systemGesturePointers.delete(event.pointerId);
            }, { capture: true, passive: true });
        }
        window.addEventListener("pagehide", () => systemGesturePointers.clear());
        for (const eventName of ["touchstart", "touchmove", "touchend", "touchcancel"]) {
            gestureArea.addEventListener(eventName, event => event.stopPropagation(), { passive: true });
        }

        // Observe an inward swipe without taking over normal scrolling or system gestures.
        let leftEdgeSwipeHandler;
        let leftEdgeTouch;
        globalThis.elementarySetLeftEdgeSwipeHandler = handler => {
            leftEdgeSwipeHandler = handler;
            leftEdgeTouch = undefined;
        };
        window.addEventListener("touchstart", event => {
            leftEdgeTouch = undefined;
            if (!leftEdgeSwipeHandler || !document.documentElement.classList.contains("elementary-ios-standalone")
                || event.touches.length !== 1 || event.target === gestureArea) return;

            const touch = event.touches[0];
            if (touch.clientX <= 28) {
                leftEdgeTouch = { id: touch.identifier, x: touch.clientX, y: touch.clientY };
            }
        }, { capture: true, passive: true });
        window.addEventListener("touchmove", event => {
            if (!leftEdgeTouch) return;
            const touch = event.touches[0];
            if (event.touches.length !== 1 || touch.identifier !== leftEdgeTouch.id) {
                leftEdgeTouch = undefined;
                return;
            }
            const dx = touch.clientX - leftEdgeTouch.x;
            const dy = Math.abs(touch.clientY - leftEdgeTouch.y);
            if (dx < -12 || (dy > 12 && dy > dx)) leftEdgeTouch = undefined;
        }, { capture: true, passive: true });
        window.addEventListener("touchend", event => {
            const start = leftEdgeTouch;
            leftEdgeTouch = undefined;
            if (!start || event.touches.length !== 0) return;

            const touch = event.changedTouches[0];
            const dx = touch.clientX - start.x;
            const dy = Math.abs(touch.clientY - start.y);
            if (touch.identifier === start.id && dx >= 56 && dx >= 2 * dy) leftEdgeSwipeHandler?.();
        }, { capture: true, passive: true });
        const resetLeftEdgeTouch = () => { leftEdgeTouch = undefined; };
        window.addEventListener("touchcancel", resetLeftEdgeTouch, { capture: true, passive: true });
        window.addEventListener("pagehide", resetLeftEdgeTouch);
    </script>
    <div id="uno-body" class="container-fluid uno-body">
        <div class="uno-loader"
             loading-position="bottom"
             loading-alert="none">

            <!-- Logo: change src to customize the logo -->
            <img class="logo"
                 src=""
                 alt="Elementary" title="Loading Elementary" />

            <!-- Uno updates this element during startup. Keep it hidden on the splash. -->
            <progress hidden></progress>
            <span class="alert"></span>
        </div>
    </div>
    <noscript>
        <p>This application requires Javascript and WebAssembly to be enabled.</p>
    </noscript>
</body>
</html>
